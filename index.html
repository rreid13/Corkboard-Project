<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="styles/calendar.css">
    <link rel="stylesheet" href="styles/editCup.css">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/reminders.css">
    <link rel="stylesheet" href="styles/stickyNote.css">
    <link rel="stylesheet" href="styles/todayCard.css">
    <link rel="stylesheet" href="styles/weatherTide.css">
    <link rel="stylesheet" href="styles/workHours.css">

</head>

<body>
    <div class="board">
        <img src="../Assets/backgrounds/backgroundSummer.png" id="background">

        <img src="../Assets/components/workHours.PNG" id="workHours">
        <div id="workHoursText"></div>

        <img src="../Assets/components/editCup/summerCupBack.png" id="editCupBack">
        <img src="../Assets/components/editCup/remindersPen.png" id="remindersPen">
        <img src="../Assets/components/editCup/workPen.png" id="workPen">
        <img src="../Assets/components/editCup/calendarPen.png" id="calendarPen">

        <img src="../Assets/components/editCup/summerCupFront.png" id="editCupFront">

        <img src="../Assets/components/stickyNotePink.PNG" id="stickyNote">
        <div id="stickyNoteText"> </div>

        <img src="../Assets/components/calendarSummer.PNG" id="calendar">
        <div id="calendarText"></div>

        <img src="../Assets/components/reminders.PNG" id="reminders">
        <div id="reminderList"></div>
        <div id="editingRemindersText">Editing reminders</div>

        <img src="../Assets/components/todayPlan.PNG" id="todayPlan">

        <img src="../Assets/components/weatherTideCard/back.PNG" id="weatherCardBack">
        <img src="../Assets/components/weatherTideCard/foldedCardFront.PNG" id="foldedCardFront">
        <img src="../Assets/components/weatherTideCard/sunnySeaAnim.PNG" id="sunnySea">
        <img src="../Assets/components/weatherTideCard/weatherIcons/largeIcons/sunnyAnim.PNG" id="foldedWeatherIcon">

        <div id="tideText"></div>
        <div id="weatherText"></div>

        <div id="weatherExpanded">
            <img src="../Assets/components/weatherTideCard/unfoldedCard.PNG" id="unfoldedCard">
            <img src="../Assets/components/weatherTideCard/foldTab.PNG" id="foldTab">
            <div id="weatherTop">
                <div id="currentWeather">
                    <img id="largeWeatherIcon">
                    <div id="currentTemperature"></div>
                </div>

                <div id="weatherSummary">
                    <div id="currentTime"></div>
                    <div id="todayHigh"></div>
                    <div id="todayLow"></div>
                    <div id="currentCondition"></div>
                </div>
            </div>

            <div id="hourlyWeather"></div>

            <div id="dailyWeather"></div>

        </div>
    </div>

    <script src="javascript/reminders.js"></script>
    <script src="javascript/workHours.js"></script>
    <script src="javascript/calendar.js"></script>

    <script src="javascript/tides.js"></script>
    <script src="javascript/weather.js"></script>
    <!-- <script src="javascript/holiday.js"></script> -->
</body>

</html>
